name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean:
    name: Clean repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Files and paths only. The denylist of names never leaves the maintainer's machine: the
      # pre-push hook (.githooks/pre-push) checks it before anything is pushed.
      - run: node scripts/check-clean.mjs

  check:
    name: Build, test, typecheck, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:coverage
      - run: pnpm typecheck
      - run: pnpm lint:ci
      - run: pnpm lint:typed
      - run: pnpm format:check
      # The dashboard needs the design system, which CI does not have: it is built and typechecked
      # by the release workflow (or locally, with AIR_DS_SOURCE). Its tests run above, on stand-ins.
